[project]
name = "loan"
version = "0.1.0"
description = "Realkredit vs. interest-swap total-cost investigator and simulator"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "httpx>=0.27",
]

[project.scripts]
loan = "loan.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
